name: NPPES CI

on:
  push:
    branches: [ "new_branch" ]
  pull_request:
    branches: [ "new_branch" ]
  workflow_dispatch:

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nppes_dbt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements_dev.txt

      - name: Setup dbt profiles
        run: |
          mkdir -p ~/.dbt
          echo "nppes_dbt:
             target: dev
             outputs:
                dev:
                  type: duckdb
                  path: ../nppes.duckdb
                  threads: 1" > ~/.dbt/profiles.yml

      - name: Install dbt
        run: pip install dbt-duckdb

      - name: dbt deps
        run: dbt deps

      - name: dbt debug
        run: dbt debug

      - name: dbt run
        run: dbt run

      - name: dbt test
        run: dbt test
